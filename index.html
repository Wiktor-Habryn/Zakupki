<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planer Posiłków</title>
    <style>
        :root {
            --primary: #4CAF50;
            --bg: #f4f7f6;
            --surface: #ffffff;
            --text: #333;
            --border: #e0e0e0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        /* Navbar */
        .navbar { display: flex; justify-content: center; background: var(--surface); padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .user-switch { display: flex; background: #eee; border-radius: 25px; overflow: hidden; }
        .user-switch button { flex: 1; padding: 10px 30px; border: none; background: none; font-size: 16px; font-weight: bold; color: #777; cursor: pointer; transition: 0.3s; }
        .user-switch button.active { background: var(--primary); color: white; }

        /* Loader */
        .loader { text-align: center; padding: 40px; font-weight: bold; color: #888; display: none; }

        /* Plan Grid */
        .plan-container { padding: 15px; max-width: 800px; margin: 0 auto; }
        .day-card { background: var(--surface); border-radius: 12px; margin-bottom: 20px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .day-title { font-size: 18px; margin-bottom: 15px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        
        .meal-row { display: flex; align-items: center; margin-bottom: 12px; }
        .meal-label { width: 90px; font-size: 14px; font-weight: bold; color: #555; }
        .meal-box { flex: 1; background: #f9f9f9; border: 1px dashed #ccc; padding: 12px; border-radius: 8px; font-size: 15px; min-height: 44px; display: flex; align-items: center; cursor: pointer; transition: 0.2s; }
        .meal-box:active { background: #eee; }
        .meal-box.filled { background: #e8f5e9; border-color: var(--primary); border-style: solid; }

        /* Modal (Wybór z bazy) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: flex-end; }
        .modal-content { background: var(--surface); width: 100%; max-height: 80vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .close-btn { font-size: 24px; cursor: pointer; color: #888; }
        .search-bar { padding: 15px; border-bottom: 1px solid var(--border); }
        .search-bar input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        
        .food-list { overflow-y: auto; padding: 10px; flex: 1; }
        .food-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 16px; }
        .food-item:active { background: #f0f0f0; }
        .food-category { font-size: 12px; color: #888; display: block; margin-top: 4px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="user-switch">
            <button id="btn-Wiktor" class="active" onclick="switchUser('Wiktor')">Wiktor</button>
            <button id="btn-Julia" onclick="switchUser('Julia')">Julia</button>
        </div>
    </nav>

    <div id="loader" class="loader">Ładowanie planu...</div>
    <div id="plan" class="plan-container"></div>

    <!-- Modal do wyboru posiłku -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Wybierz danie</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Szukaj w bazie..." onkeyup="filterBaza()">
            </div>
            <div id="foodList" class="food-list"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyUgUmZBrbj2dlOJEz-oSvHdC8FyKuqHxbE7QydKI6XbnLm5QnLONxAH7EnKo9Txq5sVQ/exec";
        let currentUser = 'Wiktor';
        let bazaDan = [];
        let currentSelection = { dayIndex: null, mealIndex: null };
        
        const dni = ["Poniedziałek", "Wtorek", "Środa", "Czwartek", "Piątek"];
        const posilki = ["Śniadanie", "Obiad", "Kolacja", "Zachcianka"];

        // Inicjalizacja aplikacji
        async function init() {
            await fetchBaza();
            await fetchPlan();
        }

        function switchUser(user) {
            currentUser = user;
            document.getElementById('btn-Wiktor').classList.toggle('active', user === 'Wiktor');
            document.getElementById('btn-Julia').classList.toggle('active', user === 'Julia');
            fetchPlan();
        }

        async function fetchBaza() {
            try {
                const response = await fetch(`${API_URL}?action=getBaza`);
                bazaDan = await response.json();
                renderBaza(bazaDan);
            } catch (error) {
                console.error("Błąd pobierania bazy:", error);
            }
        }

        async function fetchPlan() {
            const planDiv = document.getElementById('plan');
            const loader = document.getElementById('loader');
            planDiv.innerHTML = '';
            loader.style.display = 'block';

            try {
                const response = await fetch(`${API_URL}?action=getPlan&user=${currentUser}`);
                const planData = await response.json(); // Array 4x5 [meal][day]
                loader.style.display = 'none';
                renderPlan(planData);
            } catch (error) {
                loader.innerHTML = 'Błąd ładowania danych.';
                console.error(error);
            }
        }

        function renderPlan(planData) {
            const planDiv = document.getElementById('plan');
            planDiv.innerHTML = '';

            dni.forEach((dzien, dIndex) => {
                const card = document.createElement('div');
                card.className = 'day-card';
                card.innerHTML = `<div class="day-title">${dzien}</div>`;

                posilki.forEach((posilek, mIndex) => {
                    const row = document.createElement('div');
                    row.className = 'meal-row';
                    
                    // Odczytujemy dane (zamiana osi - arkusz ma wiersze jako posiłki, kolumny jako dni)
                    const aktualneDanie = planData[mIndex][dIndex] || "+ Wybierz";
                    const isFilled = aktualneDanie !== "+ Wybierz";

                    row.innerHTML = `
                        <div class="meal-label">${posilek}</div>
                        <div class="meal-box ${isFilled ? 'filled' : ''}" onclick="openModal(${dIndex}, ${mIndex})">
                            ${aktualneDanie}
                        </div>
                    `;
                    card.appendChild(row);
                });
                planDiv.appendChild(card);
            });
        }

        function openModal(dIndex, mIndex) {
            currentSelection = { dayIndex: dIndex, mealIndex: mIndex };
            document.getElementById('searchInput').value = '';
            renderBaza(bazaDan); // Reset listy
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function renderBaza(dane) {
            const list = document.getElementById('foodList');
            list.innerHTML = '';
            dane.forEach(danie => {
                const item = document.createElement('div');
                item.className = 'food-item';
                item.innerHTML = `
                    <div>${danie.name}</div>
                    <span class="food-category">${danie.category || ''}</span>
                `;
                item.onclick = () => selectDanie(danie.name);
                list.appendChild(item);
            });
        }

        function filterBaza() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = bazaDan.filter(d => d.name.toLowerCase().includes(query));
            renderBaza(filtered);
        }

        async function selectDanie(danieName) {
            closeModal();
            // Natychmiastowa aktualizacja interfejsu (optymistyczna)
            const cards = document.querySelectorAll('.day-card');
            const targetBox = cards[currentSelection.dayIndex].querySelectorAll('.meal-box')[currentSelection.mealIndex];
            targetBox.innerText = danieName + " (Zapisywanie...)";
            targetBox.classList.add('filled');

            // Wysłanie do API
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'savePlan',
                        user: currentUser,
                        dayIndex: currentSelection.dayIndex,
                        mealIndex: currentSelection.mealIndex,
                        mealName: danieName
                    })
                });
                targetBox.innerText = danieName;
            } catch (error) {
                targetBox.innerText = "Błąd zapisu!";
                console.error(error);
            }
        }

        // Zamknięcie modala po kliknięciu w tło
        window.onclick = function(event) {
            if (event.target == document.getElementById('modal')) closeModal();
        }

        // Start
        init();
    </script>
</body>
</html>
