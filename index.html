<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zakupki</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        /* Styl Native App (iOS/Material 3 blend) */
        :root {
            --primary: #007aff;
            --primary-bg: #e5f1ff;
            --success: #34c759;
            --danger: #ff3b30;
            --danger-bg: #ffeceb;
            --bg: #f2f2f7;
            --surface: #ffffff;
            --text: #000000;
            --muted: #8e8e93;
            --border: #e5e5ea;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: calc(90px + env(safe-area-inset-bottom)); overscroll-behavior-y: none; }

        /* Top Nav - Segmented Control */
        .top-nav { background: var(--surface); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 0 rgba(0,0,0,0.05); }
        .segmented-control { display: flex; background: #e3e3e8; border-radius: 9px; padding: 2px; }
        .segmented-control button { flex: 1; border: none; background: transparent; padding: 6px 0; font-size: 14px; font-weight: 600; border-radius: 7px; color: var(--text); cursor: pointer; transition: 0.2s; }
        .segmented-control button.active { background: var(--surface); box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04); }

        .container { display: none; padding: 16px; max-width: 600px; margin: 0 auto; animation: fadeIn 0.3s ease; }
        .container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Cards */
        .card { background: var(--surface); border-radius: 16px; margin-bottom: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .card-title { font-size: 18px; font-weight: 700; color: var(--primary); }
        
        /* Planer Elements */
        .plan-actions-top { display: flex; gap: 8px; margin-bottom: 16px; }
        .meal-row { display: flex; align-items: center; margin-bottom: 12px; }
        .meal-row:last-child { margin-bottom: 0; }
        .meal-label { width: 90px; font-size: 14px; font-weight: 600; color: var(--muted); }
        .meal-box { flex: 1; background: var(--bg); padding: 12px 16px; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; color: var(--muted); }
        .meal-box.filled { background: var(--primary-bg); color: var(--primary); font-weight: 600; }
        
        /* Buttons */
        .btn-icon { background: var(--bg); border: none; width: 32px; height: 32px; border-radius: 16px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 14px; color: var(--muted); }
        .btn-large { width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 12px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger-bg); color: var(--danger); }
        .btn-success { background: #e4f8ea; color: var(--success); }

        /* Shopping List & Inputs */
        .shop-add { display: flex; gap: 8px; margin-bottom: 20px; }
        .input-styled { flex: 1; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 16px; outline: none; }
        .input-styled:focus { border-color: var(--primary); }
        
        .shop-item { display: flex; align-items: center; background: var(--surface); padding: 14px; border-radius: 12px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.03); transition: 0.2s; }
        .shop-item.checked { opacity: 0.5; background: var(--bg); }
        .shop-item.checked .shop-name { text-decoration: line-through; color: var(--muted); }
        .shop-check { width: 24px; height: 24px; margin-right: 12px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
        .shop-name { flex: 1; font-size: 16px; font-weight: 500; }
        .shop-amount { width: 90px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; text-align: center; background: var(--bg); }

        /* Baza Dań */
        .baza-controls { display: flex; gap: 8px; margin-bottom: 16px; }
        .baza-select { width: 120px; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); font-size: 15px; outline: none; }
        
        .dish-card { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .dish-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .dish-name { font-size: 16px; font-weight: 600; }
        .dish-cat { font-size: 12px; color: var(--primary); background: var(--primary-bg); padding: 4px 8px; border-radius: 6px; display: inline-block; margin-top: 4px; }
        .dish-ingredients { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
        .dish-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
        .btn-action { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-edit { background: var(--bg); color: var(--text); }
        .btn-del { background: var(--danger-bg); color: var(--danger); }
        .btn-export { background: #fff5e5; color: #ff9500; flex: 2; }

        /* Bottom Sheet Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: flex-end; backdrop-filter: blur(4px); }
        .sheet { background: var(--bg); width: 100%; max-width: 600px; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; max-height: 90vh; animation: slideUp 0.35s cubic-bezier(0.1, 0.9, 0.2, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .sheet-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); border-radius: 24px 24px 0 0; }
        .sheet-title { font-size: 18px; font-weight: 700; }
        .sheet-close { font-size: 28px; color: var(--muted); background: none; border: none; cursor: pointer; line-height: 1; }
        .sheet-body { overflow-y: auto; padding: 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        
        .modal-item { background: var(--surface); padding: 16px; border-radius: 12px; margin-bottom: 8px; font-size: 16px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; margin-left: 4px; }
        textarea.input-styled { resize: none; height: 80px; }

        /* Floating Action Button */
        .fab { position: fixed; bottom: calc(85px + env(safe-area-inset-bottom)); right: 20px; width: 56px; height: 56px; background: var(--primary); color: white; border-radius: 28px; display: flex; justify-content: center; align-items: center; font-size: 28px; box-shadow: 0 4px 12px rgba(0,122,255,0.4); border: none; cursor: pointer; z-index: 90; display: none; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); display: flex; border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        .nav-tab { flex: 1; text-align: center; padding: 12px 0; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-icon { font-size: 22px; }
        .nav-tab.active { color: var(--primary); }
        
        /* Układ modal list składników */
        .ing-controls { display: flex; gap: 8px; margin-bottom: 12px; }
    </style>
</head>
<body>

    <header class="top-nav" id="topNav">
        <div class="segmented-control">
            <button id="btn-user-Wiktor" class="active" onclick="switchUser('Wiktor')">Wiktor</button>
            <button id="btn-user-Julia" onclick="switchUser('Julia')">Julia</button>
        </div>
    </header>

    <!-- WIDOK 1: PLANER -->
    <main id="view-plan" class="container active">
        <!-- Akcje na samej górze -->
        <div class="plan-actions-top">
            <button class="btn-large btn-success" style="margin-bottom: 0;" onclick="exportPlanIngredients()">
                🛒 Do koszyka
            </button>
            <button class="btn-large btn-danger" style="margin-bottom: 0;" onclick="clearWeek()">
                🧹 Wyczyść plan
            </button>
        </div>
        
        <div id="plan-cards"></div>
    </main>

    <!-- WIDOK 2: ZAKUPY -->
    <main id="view-shop" class="container">
        <div class="shop-add">
            <input type="text" id="newShopInput" class="input-styled" placeholder="Dodaj produkt do koszyka..." onkeypress="if(event.key==='Enter') addShopItem()">
            <button class="btn-large btn-primary" style="width: auto; margin:0;" onclick="addShopItem()">Dodaj</button>
        </div>
        <div id="shop-list-container"></div>
        <button class="btn-large btn-danger" style="margin-top:20px;" onclick="clearPurchased()">🗑 Usuń odhaczone</button>
    </main>

    <!-- WIDOK 3: BAZA DAŃ -->
    <main id="view-baza" class="container">
        <div class="baza-controls">
            <input type="text" id="bazaSearch" class="input-styled" placeholder="Szukaj dania..." onkeyup="updateBazaView()">
            <select id="bazaSort" class="baza-select" onchange="updateBazaView()">
                <option value="az">A - Z</option>
                <option value="za">Z - A</option>
                <option value="cat">Kategoria</option>
            </select>
        </div>
        <div id="baza-list-container"></div>
    </main>
    <button id="fab-add" class="fab" onclick="openDishEditor()">+</button>

    <!-- DOLNY PASEK NAWIGACJI -->
    <nav class="bottom-nav">
        <div id="tab-plan" class="nav-tab active" onclick="switchTab('plan')">
            <span class="nav-icon">📅</span> Planer
        </div>
        <div id="tab-shop" class="nav-tab" onclick="switchTab('shop')">
            <span class="nav-icon">🛒</span> Zakupy
        </div>
        <div id="tab-baza" class="nav-tab" onclick="switchTab('baza')">
            <span class="nav-icon">🍲</span> Baza
        </div>
    </nav>

    <!-- MODAL 1: WYBÓR POSIŁKU DO PLANU -->
    <div id="foodModal" class="modal">
        <div class="sheet">
            <div class="sheet-header">
                <h3 class="sheet-title">Wybierz danie</h3>
                <button class="sheet-close" onclick="closeModal('foodModal')">&times;</button>
            </div>
            <div style="padding: 16px; background: var(--surface);">
                <input type="text" id="modalSearch" class="input-styled" style="width:100%;" placeholder="Szukaj dania..." onkeyup="filterModalDishes()">
            </div>
            <div class="sheet-body" id="modalDishesList"></div>
        </div>
    </div>

    <!-- MODAL 2: EDYTOR DANIA -->
    <div id="dishModal" class="modal">
        <div class="sheet">
            <div class="sheet-header">
                <h3 class="sheet-title" id="dishModalTitle">Nowe Danie</h3>
                <button class="sheet-close" onclick="closeModal('dishModal')">&times;</button>
            </div>
            <div class="sheet-body">
                <input type="hidden" id="editDishId">
                <div class="form-group">
                    <label class="form-label">Nazwa dania</label>
                    <input type="text" id="editDishName" class="input-styled" style="width:100%;" placeholder="np. Spaghetti">
                </div>
                <div class="form-group">
                    <label class="form-label">Kategoria</label>
                    <input type="text" id="editDishCat" class="input-styled" style="width:100%;" placeholder="np. Danie główne">
                </div>
                <div class="form-group">
                    <label class="form-label">Składniki (oddzielone przecinkiem)</label>
                    <textarea id="editDishIng" class="input-styled" style="width:100%;" placeholder="Mleko, Jajka, Mąka..."></textarea>
                </div>
                <button class="btn-large btn-primary" onclick="saveDish()">Zapisz Danie</button>
            </div>
        </div>
    </div>

    <!-- MODAL 3: WYBÓR SKŁADNIKÓW DO KOSZYKA -->
    <div id="ingredientModal" class="modal">
        <div class="sheet">
            <div class="sheet-header">
                <h3 class="sheet-title">Wybierz składniki</h3>
                <button class="sheet-close" onclick="closeModal('ingredientModal')">&times;</button>
            </div>
            <div class="sheet-body">
                <div class="ing-controls">
                    <button class="btn-action btn-edit" onclick="toggleAllIngredients(true)">Zaznacz wszystkie</button>
                    <button class="btn-action btn-edit" onclick="toggleAllIngredients(false)">Odznacz</button>
                </div>
                <div id="ingredientModalList" style="margin-bottom: 20px;"></div>
                <button class="btn-large btn-success" onclick="confirmAddIngredients()">🛒 Dodaj do listy zakupów</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, doc, setDoc, onSnapshot, addDoc, updateDoc, deleteDoc, deleteField
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjITwMC0x5D9uJWOdBVuz7qL8I23sS6Yo",
            authDomain: "zakupki-177d6.firebaseapp.com",
            projectId: "zakupki-177d6",
            storageBucket: "zakupki-177d6.firebasestorage.app",
            messagingSenderId: "387440133726",
            appId: "1:387440133726:web:57e13dcea7c3ae979316cf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Zmienne stanu
        let currentUser = 'Wiktor';
        let dishes = [];
        let shoppingItems = [];
        let currentPlan = {};
        let activeSelection = { day: null, meal: null };

        const DNI = ["Poniedziałek", "Wtorek", "Środa", "Czwartek", "Piątek"];
        const POSILKI = ["Śniadanie", "Obiad", "Kolacja", "Zachcianka"];

        // --- NAWIGACJA ---
        window.switchTab = function(tab) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));

            document.getElementById(`view-${tab}`).classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById('topNav').style.display = tab === 'plan' ? 'block' : 'none';
            document.getElementById('fab-add').style.display = tab === 'baza' ? 'flex' : 'none';
        };

        window.switchUser = function(user) {
            currentUser = user;
            document.getElementById('btn-user-Wiktor').classList.toggle('active', user === 'Wiktor');
            document.getElementById('btn-user-Julia').classList.toggle('active', user === 'Julia');
            listenToPlan();
        };

        // --- BAZA DAŃ Z SORTOWANIEM I FILTROWANIEM ---
        onSnapshot(collection(db, "dishes"), (snapshot) => {
            dishes = [];
            snapshot.forEach(d => dishes.push({ id: d.id, ...d.data() }));
            updateBazaView();
        });

        window.updateBazaView = function() {
            const query = document.getElementById('bazaSearch').value.toLowerCase();
            const sortBy = document.getElementById('bazaSort').value;
            
            // Filtrowanie
            let filtered = dishes.filter(d => (d.name || '').toLowerCase().includes(query));
            
            // Sortowanie
            filtered.sort((a, b) => {
                const nameA = (a.name || '').toLowerCase();
                const nameB = (b.name || '').toLowerCase();
                const catA = (a.category || '').toLowerCase();
                const catB = (b.category || '').toLowerCase();

                if (sortBy === 'az') return nameA.localeCompare(nameB);
                if (sortBy === 'za') return nameB.localeCompare(nameA);
                if (sortBy === 'cat') {
                    if (catA === catB) return nameA.localeCompare(nameB);
                    return catA.localeCompare(catB);
                }
                return 0;
            });

            renderBaza(filtered);
        };

        function renderBaza(listToRender) {
            const container = document.getElementById('baza-list-container');
            container.innerHTML = '';
            
            if(listToRender.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">Brak wyników.</div>';
                return;
            }

            listToRender.forEach(d => {
                const item = document.createElement('div');
                item.className = 'dish-card';
                const ingText = d.ingredients ? d.ingredients : 'Brak przypisanych składników';
                
                item.innerHTML = `
                    <div class="dish-header">
                        <div>
                            <div class="dish-name">${d.name}</div>
                            ${d.category ? `<div class="dish-cat">${d.category}</div>` : ''}
                        </div>
                    </div>
                    <div class="dish-ingredients">🛒 ${ingText}</div>
                    
                    <div class="dish-actions">
                        <button class="btn-action btn-export" onclick="exportSingleDish('${d.id}')">🛒 Do koszyka</button>
                        <button class="btn-action btn-edit" onclick="openDishEditor('${d.id}')">✏️ Edytuj</button>
                        <button class="btn-action btn-del" onclick="deleteDish('${d.id}')">Usuń</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        window.openDishEditor = function(id = null) {
            const title = document.getElementById('dishModalTitle');
            const idInput = document.getElementById('editDishId');
            const nameInput = document.getElementById('editDishName');
            const catInput = document.getElementById('editDishCat');
            const ingInput = document.getElementById('editDishIng');

            if (id) {
                const d = dishes.find(x => x.id === id);
                title.innerText = "Edytuj Danie";
                idInput.value = d.id;
                nameInput.value = d.name || '';
                catInput.value = d.category || '';
                ingInput.value = d.ingredients || '';
            } else {
                title.innerText = "Nowe Danie";
                idInput.value = '';
                nameInput.value = '';
                catInput.value = '';
                ingInput.value = '';
            }
            document.getElementById('dishModal').style.display = 'flex';
        };

        window.saveDish = async function() {
            const id = document.getElementById('editDishId').value;
            const name = document.getElementById('editDishName').value.trim();
            const cat = document.getElementById('editDishCat').value.trim();
            const ing = document.getElementById('editDishIng').value.trim();

            if (!name) return alert('Podaj nazwę dania!');
            const dishData = { name: name, category: cat, ingredients: ing };

            if (id) {
                await updateDoc(doc(db, "dishes", id), dishData);
            } else {
                await addDoc(collection(db, "dishes"), dishData);
            }
            closeModal('dishModal');
        };

        window.deleteDish = async function(id) {
            if (confirm("Na pewno usunąć to danie?")) {
                await deleteDoc(doc(db, "dishes", id));
            }
        };

        // --- EKSPORT SKŁADNIKÓW DO KOSZYKA ---
        window.exportSingleDish = function(id) {
            const d = dishes.find(x => x.id === id);
            if (!d || !d.ingredients) return alert('To danie nie ma wpisanych składników.');
            
            const ingList = d.ingredients.split(',').map(i => i.trim()).filter(i => i);
            if(ingList.length === 0) return alert('Brak składników do eksportu.');
            
            openIngredientModal(ingList);
        };

        window.exportPlanIngredients = function() {
            const planDishes = Object.values(currentPlan).filter(d => d && d !== "");
            if(planDishes.length === 0) return alert('Plan jest pusty.');
            
            let allIngs = [];
            planDishes.forEach(dishName => {
                const d = dishes.find(x => x.name === dishName);
                if (d && d.ingredients) {
                    allIngs.push(...d.ingredients.split(',').map(i => i.trim()).filter(i => i));
                }
            });
            
            if(allIngs.length === 0) return alert('Dania w planie nie mają uzupełnionych składników.');
            
            allIngs = [...new Set(allIngs)];
            openIngredientModal(allIngs);
        };

        window.openIngredientModal = function(ingList) {
            const listDiv = document.getElementById('ingredientModalList');
            listDiv.innerHTML = '';
            
            ingList.forEach((ing, index) => {
                const item = document.createElement('div');
                item.className = 'shop-item'; 
                item.style.marginBottom = '6px';
                item.innerHTML = `
                    <input type="checkbox" class="shop-check ing-export-checkbox" id="exp_${index}" value="${ing}" checked>
                    <label class="shop-name" for="exp_${index}" style="cursor:pointer;">${ing}</label>
                `;
                listDiv.appendChild(item);
            });
            
            document.getElementById('ingredientModal').style.display = 'flex';
        };

        window.toggleAllIngredients = function(checked) {
            const checkboxes = document.querySelectorAll('.ing-export-checkbox');
            checkboxes.forEach(cb => cb.checked = checked);
        };

        window.confirmAddIngredients = async function() {
            const checkboxes = document.querySelectorAll('.ing-export-checkbox:checked');
            if(checkboxes.length === 0) return alert('Nie wybrano żadnych składników!');

            for (let cb of checkboxes) {
                await addDoc(collection(db, "shopping"), { name: cb.value, amount: "", checked: false, createdAt: Date.now() });
            }
            
            closeModal('ingredientModal');
            alert('Dodano wybrane składniki do listy zakupów!');
            switchTab('shop');
        };

        // --- PLANER POSIŁKÓW ---
        let unsubscribePlan = null;
        function listenToPlan() {
            if (unsubscribePlan) unsubscribePlan();
            unsubscribePlan = onSnapshot(doc(db, "plans", currentUser), (snap) => {
                currentPlan = snap.exists() ? snap.data() : {};
                renderPlan();
            });
        }
        listenToPlan();

        function renderPlan() {
            const container = document.getElementById('plan-cards');
            container.innerHTML = '';

            DNI.forEach(dzien => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title">${dzien}</div>
                        <button class="btn-icon" onclick="clearDay('${dzien}')">🧹</button>
                    </div>
                `;

                POSILKI.forEach(posilek => {
                    const key = `${dzien}_${posilek}`;
                    const dish = currentPlan[key];
                    const isFilled = dish && dish !== "";

                    const row = document.createElement('div');
                    row.className = 'meal-row';
                    row.innerHTML = `
                        <div class="meal-label">${posilek}</div>
                        <div class="meal-box ${isFilled ? 'filled' : ''}" onclick="openFoodModal('${dzien}', '${posilek}')">
                            ${isFilled ? dish : "+ Wybierz"}
                        </div>
                    `;
                    card.appendChild(row);
                });
                container.appendChild(card);
            });
        }

        window.clearDay = async function(day) {
            if(!confirm(`Wyczyścić plan na ${day}?`)) return;
            const updates = {};
            POSILKI.forEach(meal => { updates[`${day}_${meal}`] = deleteField(); });
            await updateDoc(doc(db, "plans", currentUser), updates);
        };

        window.clearWeek = async function() {
            if(!confirm(`Wyczyścić cały tydzień dla: ${currentUser}?`)) return;
            const updates = {};
            DNI.forEach(day => { POSILKI.forEach(meal => { updates[`${day}_${meal}`] = deleteField(); }); });
            await updateDoc(doc(db, "plans", currentUser), updates);
        };

        window.openFoodModal = function(day, meal) {
            activeSelection = { day, meal };
            document.getElementById('modalSearch').value = '';
            filterModalDishes();
            document.getElementById('foodModal').style.display = 'flex';
        };

        window.filterModalDishes = function() {
            const q = document.getElementById('modalSearch').value.toLowerCase();
            const filtered = dishes.filter(d => d.name.toLowerCase().includes(q));
            
            const c = document.getElementById('modalDishesList');
            c.innerHTML = '<div class="modal-item" style="color: var(--danger); text-align:center;" onclick="selectDishForPlan(null)">Odznacz / Wyczyść pole</div>';
            filtered.forEach(d => {
                const el = document.createElement('div');
                el.className = 'modal-item';
                el.innerText = d.name;
                el.onclick = () => selectDishForPlan(d.name);
                c.appendChild(el);
            });
        };

        window.selectDishForPlan = async function(dishName) {
            closeModal('foodModal');
            const key = `${activeSelection.day}_${activeSelection.meal}`;
            const ref = doc(db, "plans", currentUser);
            
            if (dishName === null) {
                await updateDoc(ref, { [key]: deleteField() }).catch(e => setDoc(ref, {}));
            } else {
                await setDoc(ref, { [key]: dishName }, { merge: true });
            }
        };

        // --- ZAKUPY ---
        onSnapshot(collection(db, "shopping"), (snapshot) => {
            shoppingItems = [];
            snapshot.forEach(d => shoppingItems.push({ id: d.id, ...d.data() }));
            shoppingItems.sort((a,b) => (a.createdAt || 0) - (b.createdAt || 0));
            renderShopping();
        });

        function renderShopping() {
            const c = document.getElementById('shop-list-container');
            c.innerHTML = '';
            shoppingItems.forEach(item => {
                const el = document.createElement('div');
                el.className = `shop-item ${item.checked ? 'checked' : ''}`;
                el.innerHTML = `
                    <input type="checkbox" class="shop-check" ${item.checked ? 'checked' : ''} onchange="toggleShopCheck('${item.id}', this.checked)">
                    <div class="shop-name">${item.name}</div>
                    <input type="text" class="shop-amount" value="${item.amount || ''}" placeholder="Ilość" onchange="updateShopAmount('${item.id}', this.value)">
                `;
                c.appendChild(el);
            });
        }

        window.addShopItem = async function() {
            const input = document.getElementById('newShopInput');
            const name = input.value.trim();
            if (!name) return;
            input.value = '';
            await addDoc(collection(db, "shopping"), { name: name, amount: "", checked: false, createdAt: Date.now() });
        };

        window.toggleShopCheck = async function(id, isChecked) {
            await updateDoc(doc(db, "shopping", id), { checked: isChecked });
        };

        window.updateShopAmount = async function(id, val) {
            await updateDoc(doc(db, "shopping", id), { amount: val });
        };

        window.clearPurchased = async function() {
            const toDelete = shoppingItems.filter(i => i.checked);
            for (const item of toDelete) {
                await deleteDoc(doc(db, "shopping", item.id));
            }
        };

        // Modal Controls
        window.closeModal = function(id) {
            document.getElementById(id).style.display = 'none';
        }
        window.onclick = function(e) {
            if (e.target.classList.contains('modal')) e.target.style.display = 'none';
        };
    </script>
</body>
</html>
